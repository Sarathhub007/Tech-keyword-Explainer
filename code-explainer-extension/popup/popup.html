<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeWord Explainer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <img src="../icons/icon-48.png" alt="Logo" class="app-logo">
        <div>
          <h1 class="app-title">CodeWord Explainer</h1>
          <p class="app-subtitle">Double-click any coding keyword</p>
        </div>
      </div>
      <button id="btnOpenTest" class="btn-icon" title="Open Interactive Test Sandbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </header>

    <!-- Master Switch Card -->
    <div class="card status-card">
      <div class="status-info">
        <span class="status-title">Double-Click Detection</span>
        <span id="statusIndicator" class="status-desc">Active on all pages</span>
      </div>
      <label class="switch" aria-label="Toggle Extension">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Search Section -->
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search a keyword (e.g. closure, docker, async)..." autocomplete="off">
      <button id="btnClearSearch" class="btn-clear hidden" aria-label="Clear search">✕</button>
    </div>

    <!-- Live Result / Keyword Card -->
    <div id="detailView" class="detail-view hidden"></div>

    <!-- Search Results Dropdown List -->
    <div id="searchResultsList" class="search-results hidden"></div>

    <!-- Category Browser -->
    <section class="section" id="exploreSection">
      <div class="section-header">
        <span class="section-title">Quick Explore</span>
        <span id="termsCount" class="badge-count">150+ terms</span>
      </div>
      <div class="tags-cloud" id="tagsCloud">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Settings Collapsible / Footer -->
    <footer class="app-footer">
      <div class="setting-row">
        <span>Pronounce Words 🔊</span>
        <label class="switch-small">
          <input type="checkbox" id="toggleVoice" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <span>Theme</span>
        <select id="themeSelect" class="theme-select">
          <option value="auto">Auto (System)</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <div class="footer-links">
        <button id="btnOpenSandboxLink" class="link-btn">🧪 Open Sandbox Playground</button>
      </div>
    </footer>
  </div>

  <script src="../content/dictionary.js"></script>
  <script src="popup.js"></script>
</body>
</html>
